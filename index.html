<!-- The shell tags are written while the page is still parsing, so the load event waits for them
     and each file is requested once. The head already asked the worker to take charge, so that
     one request is the cached copy whenever the worker is ready in time. -->
<script>
(function () {
  const urls = [...document.querySelectorAll("[data-shell]")].map(n => n.getAttribute("data-shell"));
  const tags = urls.filter(u => u.endsWith(".css")).map(u => '<link rel="stylesheet" href="' + u + '">').join("")
    + urls.filter(u => !u.endsWith(".css")).map(u => '<script defer src="' + u + '"><\/script>').join("");
  document.write(tags);
  if (navigator.serviceWorker && !window.__WR_NO_SW && !navigator.serviceWorker.controller) navigator.serviceWorker.register("sw.js");
})();
</script>
