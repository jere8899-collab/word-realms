<!-- Load each shell file once, after the worker is in charge, so that one response is the cached copy.
     A script or stylesheet response cannot be stored later, and fetching it again downloads it twice. -->
<script>
(function () {
  const nodes = () => [...document.querySelectorAll("[data-shell]")];
  let started = false;
  const start = () => {
    if (started) return; started = true;
    const css = [], js = [];
    nodes().forEach(n => { const u = n.getAttribute("data-shell"); (u.endsWith(".css") ? css : js).push(u); });
    let left = css.length;
    const scripts = () => js.forEach(u => { const s = document.createElement("script"); s.src = u; s.async = false; document.body.appendChild(s); });
    if (!left) { scripts(); return; }
    css.forEach(u => {
      const link = document.createElement("link"); link.rel = "stylesheet"; link.href = u;
      link.onload = link.onerror = () => { if (--left === 0) scripts(); };
      document.head.appendChild(link);
    });
  };
  const sw = navigator.serviceWorker;
  if (!sw || window.__WR_NO_SW || sw.controller) { start(); return; }
  const giveUp = setTimeout(start, 4000);
  sw.addEventListener("controllerchange", () => { clearTimeout(giveUp); start(); });
  sw.register("sw.js").catch(() => { clearTimeout(giveUp); start(); });
})();
</script>
